name: CI
on:
  push: { branches: [Prod, Dev] }
  pull_request: { branches: [Prod, Dev] }
concurrency: { group: "${{ github.workflow }}-${{ github.ref }}", cancel-in-progress: true }
jobs:
  verify:
    name: Verify (typecheck·lint·test·build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - run: bash scripts/verify.sh
  security:
    name: Security (gitleaks·audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks (strict)
        run: |
          set -euo pipefail
          V=8.30.1
          curl -fsSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          tar xzf gl.tgz gitleaks
          ./gitleaks detect --no-banner --redact --config=.gitleaks.toml --source=.
      - uses: actions/setup-node@v7
        with: { node-version: "20", cache: "npm" }
      - run: npm ci
      - name: dependency audit (advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
  database:
    name: DB (migrations + RLS proof + seed)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres, PGDATABASE: postgres }
    steps:
      - uses: actions/checkout@v7
      # pgTAP is a server-side extension: pgtap.control has to sit in the
      # postmaster's own filesystem. apt on the runner cannot reach into a
      # `services:` container, so Postgres runs on the runner itself.
      - name: Postgres 16 + pgTAP
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-16 postgresql-client-16 postgresql-16-pgtap
          sudo pg_ctlcluster 16 main start || true
          PORT=$(pg_lsclusters -h | awk '$1==16 && $2=="main" {print $3}')
          echo "PGPORT=$PORT" >> "$GITHUB_ENV"
          pg_isready -h localhost -p "$PORT" -t 30
          sudo -u postgres psql -p "$PORT" -c "alter user postgres password 'postgres';"
      - run: bash scripts/run-db-tests.sh
      # The demo seed is documentation people actually run — keep it applying cleanly.
      - name: seed applies to a fresh schema
        run: psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
