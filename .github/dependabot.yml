version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      prod: { dependency-type: "production", update-types: ["minor","patch"] }
      dev:  { dependency-type: "development" }
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
